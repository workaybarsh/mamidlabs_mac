name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1
          python -m pip install requests pillow huggingface_hub ddgs pypdf \
            reportlab python-docx python-pptx openpyxl rarfile matplotlib

      - name: Install the package (without the GUI)
        run: python -m pip install --no-deps -e .

      - name: Syntax check
        run: |
          python -m compileall -q mamidlabs
          bash -n scripts/install-mamidlabs.sh
          bash -n scripts/manage-mamidlabs.sh
          bash -n scripts/uninstall-mamidlabs.sh
          bash -n scripts/smoke-test.sh
          bash -n scripts/mamidlabs-setup.sh
          bash -n packaging/macos/build-dmg.sh

      - name: pytest
        run: python -m pytest -q

  gui:
    name: Interface tests (headless)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies and PySide6
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 PySide6
          python -m pip install requests pillow huggingface_hub ddgs pypdf \
            reportlab python-docx python-pptx openpyxl rarfile matplotlib

      - name: Install the package
        run: python -m pip install --no-deps -e .

      - name: Wizard and interface tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_wizard_gui.py -q

      - name: Wizard smoke test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          MAMIDLABS_ROOT: ${{ runner.temp }}/mamidlabs
        run: |
          python -c "from PySide6.QtWidgets import QApplication; \
            from mamidlabs.wizard.setup import SetupWizard; \
            app = QApplication([]); wizard = SetupWizard(language='en'); \
            print('Wizard smoke OK:', wizard.windowTitle(), len(wizard.pages), 'pages')"
